name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # The postinstall tries to rebuild the SQLCipher native module
      # for Electron's Node ABI. That needs Python + node-gyp and is
      # not required for typecheck or web bundling, so skip on CI.
      - name: Install dependencies (skip native rebuild)
        run: npm ci --ignore-scripts

      - name: Type-check workspace
        run: npm run typecheck

      - name: Build extension
        run: npm run build:extension

      - name: Build desktop (renderer + main + preload bundles)
        run: npm run build:desktop

      - name: Build landing
        run: npm run build:landing
