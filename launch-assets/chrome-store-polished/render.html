<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280,height=800,initial-scale=1" />
  <title>OctoVault Chrome Store Screenshots</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1280px;
      height: 800px;
      overflow: hidden;
      background: #f6f5ef;
      color: #171717;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .slide {
      position: relative;
      width: 1280px;
      height: 800px;
      padding: 52px 64px;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.94), rgba(238,246,241,0.9) 48%, rgba(235,243,247,0.92)),
        #f6f5ef;
    }
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(23,23,23,0.065) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(23,23,23,0.065) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(circle at 34% 40%, black 0, transparent 68%);
      pointer-events: none;
    }
    .brand {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #171717;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0;
    }
    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      box-shadow: 0 14px 38px rgba(23,23,23,0.16);
    }
    .copy {
      position: relative;
      z-index: 3;
      width: 520px;
      margin-top: 82px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(23,23,23,0.14);
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      color: #395949;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    h1 {
      margin: 18px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 58px;
      line-height: 0.98;
      font-weight: 500;
      letter-spacing: 0;
    }
    p {
      margin: 22px 0 0;
      max-width: 500px;
      color: #4b5563;
      font-size: 22px;
      line-height: 1.34;
      letter-spacing: 0;
    }
    .proofs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
      max-width: 520px;
    }
    .proof {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 12px;
      border-radius: 8px;
      background: #171717;
      color: #fafafa;
      font-size: 13px;
      font-weight: 700;
    }
    .stage {
      position: absolute;
      z-index: 2;
      right: 56px;
      top: 130px;
      width: 610px;
      height: 500px;
      border: 1px solid rgba(23,23,23,0.12);
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 34px 95px rgba(31,45,55,0.20);
      overflow: hidden;
      transform: rotate(-1deg);
    }
    .stage.wide {
      top: 122px;
      width: 650px;
      height: 470px;
    }
    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .stage.graph img { object-position: 62% 46%; }
    .stage.conflict img { object-position: 62% 50%; }
    .stage.chat img { object-position: 58% 48%; }
    .stage.form img { object-position: 60% 50%; }
    .node-card {
      position: absolute;
      z-index: 4;
      right: 540px;
      top: 520px;
      width: 210px;
      padding: 14px 16px;
      border: 1px solid rgba(23,23,23,0.12);
      border-radius: 12px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 18px 48px rgba(23,23,23,0.14);
      backdrop-filter: blur(10px);
      font-size: 13px;
      line-height: 1.35;
      color: #4b5563;
    }
    .node-card strong {
      display: block;
      margin-bottom: 4px;
      color: #171717;
      font-size: 15px;
    }
    .connector {
      position: absolute;
      z-index: 3;
      right: 470px;
      top: 484px;
      width: 150px;
      height: 2px;
      background: #4f8b70;
      transform: rotate(-18deg);
      transform-origin: left center;
    }
    .footer {
      position: absolute;
      z-index: 3;
      left: 64px;
      bottom: 40px;
      color: #6b7280;
      font-size: 14px;
      font-weight: 600;
    }
    .slide.form-fill .stage {
      right: 64px;
      top: 120px;
      width: 655px;
      height: 470px;
      transform: rotate(1deg);
    }
    .slide.local .stage {
      width: 650px;
      height: 440px;
      top: 150px;
    }
    .privacy-stack {
      position: absolute;
      z-index: 4;
      right: 116px;
      top: 190px;
      width: 520px;
      display: grid;
      gap: 16px;
    }
    .privacy-row {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 78px;
      padding: 16px 18px;
      border: 1px solid rgba(23,23,23,0.12);
      border-radius: 14px;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 18px 44px rgba(23,23,23,0.10);
    }
    .privacy-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 10px;
      background: #171717;
      color: #fafafa;
      font-size: 22px;
      font-weight: 800;
    }
    .privacy-row strong {
      display: block;
      color: #171717;
      font-size: 17px;
      margin-bottom: 3px;
    }
    .privacy-row span {
      color: #4b5563;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const base = new URL("../../", location.href);
    const assets = {
      logo: new URL("../../octovault-logo-128-rgb.png", location.href).href,
      hero: new URL("../../chrome-store-screenshots/01-private-vault-1280x800.png", location.href).href,
      graph: new URL("../../chrome-store-screenshots/02-knowledge-graph-1280x800.png", location.href).href,
      conflict: new URL("../../chrome-store-screenshots/03-conflict-resolution-1280x800.png", location.href).href,
      chat: new URL("../../chrome-store-screenshots/04-chat-citations-1280x800.png", location.href).href,
      form: new URL("../../chrome-store-screenshots/05-form-fill-extension-1280x800.png", location.href).href,
    };
    const slides = [
      {
        cls: "graph",
        eyebrow: "Private knowledge graph",
        title: "Your paperwork becomes a trusted graph.",
        body: "OctoVault extracts people, documents, dates, facts, and relationships into one local graph you can inspect.",
        proofs: ["Local vault", "Entity graph", "Source-backed facts"],
        image: assets.graph,
        cardTitle: "Source-backed facts",
        cardBody: "Every field points back to the document it came from."
      },
      {
        cls: "conflict",
        eyebrow: "Trust and correction",
        title: "Conflicts are visible before they matter.",
        body: "When two documents disagree, OctoVault shows the competing values so you choose the canonical fact.",
        proofs: ["Conflict review", "Merge entities", "Keep provenance"],
        image: assets.conflict,
        cardTitle: "You stay in control",
        cardBody: "Review, merge, and correct the graph without losing history."
      },
      {
        cls: "chat",
        eyebrow: "Ask your vault",
        title: "Chat with answers grounded in your documents.",
        body: "Ask immigration, work, travel, or identity questions and get cited answers from the local graph.",
        proofs: ["Citations", "Private retrieval", "Local AI"],
        image: assets.chat,
        cardTitle: "Cited answers",
        cardBody: "Answers trace back to the facts and documents in your vault."
      },
      {
        cls: "form-fill",
        eyebrow: "One useful surface",
        title: "Form filling is powered by the graph.",
        body: "Fill job, travel, and immigration forms from facts already verified in your private vault.",
        proofs: ["Job apps", "Travel forms", "Review before submit"],
        image: assets.form,
        cardTitle: "Graph → form",
        cardBody: "The extension is a demo surface for your personal knowledge OS."
      },
      {
        cls: "local",
        eyebrow: "Local-first by design",
        title: "Private documents stay on your device.",
        body: "Desktop vault, browser fallback, local inference, and no cloud document upload in the product runtime.",
        proofs: ["SQLCipher", "IndexedDB", "Ollama local AI"],
        image: assets.hero,
        privacy: true,
      },
    ];

    function render(slide) {
      const stage = slide.privacy
        ? `<div class="privacy-stack">
            <div class="privacy-row"><div class="privacy-icon">0</div><div><strong>No cloud document upload</strong><span>Your vault is local-first.</span></div></div>
            <div class="privacy-row"><div class="privacy-icon">KG</div><div><strong>Knowledge graph is the product</strong><span>Chat and form-fill are surfaces on top.</span></div></div>
            <div class="privacy-row"><div class="privacy-icon">AI</div><div><strong>Local inference ready</strong><span>Designed around Ollama and on-device storage.</span></div></div>
          </div>`
        : `<div class="stage ${slide.cls}"><img src="${slide.image}" /></div>
           <div class="connector"></div>
           <div class="node-card"><strong>${slide.cardTitle}</strong>${slide.cardBody}</div>`;
      return `<section class="slide ${slide.cls}">
        <div class="brand"><img src="${assets.logo}" />OctoVault AI</div>
        <div class="copy">
          <div class="eyebrow">${slide.eyebrow}</div>
          <h1>${slide.title}</h1>
          <p>${slide.body}</p>
          <div class="proofs">${slide.proofs.map((p) => `<span class="proof">${p}</span>`).join("")}</div>
        </div>
        ${stage}
        <div class="footer">Private paperwork graph for forms, questions, and decisions.</div>
      </section>`;
    }
    const slide = slides[(Number(new URLSearchParams(location.search).get("slide")) || 1) - 1] || slides[0];
    document.getElementById("root").innerHTML = render(slide);
  </script>
</body>
</html>
