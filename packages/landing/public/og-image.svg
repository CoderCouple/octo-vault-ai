<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background. Neutral charcoal so the white OctoMark badge pops
       and the wordmark stays high-contrast. -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid lines for the technical / vault feel. -->
  <g stroke="#1f1f1f" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Canonical OctoMark — exactly the favicon, scaled 8× (24px → 192px).
       Black rounded-square badge with the white octagon-keyhole inside.
       Source: packages/ui/src/components/octo-mark.tsx. -->
  <g transform="translate(100 219) scale(8)">
    <rect width="24" height="24" rx="4.5" fill="#0a0a0a"/>
    <rect width="24" height="24" rx="4.5" fill="none" stroke="#fafafa" stroke-width="0.5" stroke-opacity="0.25"/>
    <g transform="translate(3 3) scale(0.75)">
      <polygon points="7,1.5 17,1.5 22.5,7 22.5,17 17,22.5 7,22.5 1.5,17 1.5,7"
               fill="none" stroke="#fafafa" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="12" cy="11" r="1.85" fill="#fafafa"/>
      <path d="M11 12.5 L11 16.25 L13 16.25 L13 12.5 Z" fill="#fafafa"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#fafafa">
    <text x="328" y="295" font-size="76" font-weight="700" letter-spacing="-0.02em">OctoVault AI</text>
    <text x="330" y="350" font-size="30" font-weight="500" fill="#d4d4d4" letter-spacing="-0.005em">
      Your private, on-device document AI
    </text>
    <text x="330" y="392" font-size="20" font-weight="400" fill="#a3a3a3">
      Local knowledge graph for personal documents — chat with your vault, nothing leaves your device
    </text>
  </g>

  <!-- Feature row -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" fill="#737373" font-size="18">
    <text x="100" y="540">EXTRACT</text>
    <text x="240" y="540" fill="#525252">·</text>
    <text x="260" y="540">GRAPH</text>
    <text x="370" y="540" fill="#525252">·</text>
    <text x="390" y="540">CHAT</text>
    <text x="480" y="540" fill="#525252">·</text>
    <text x="500" y="540">FILL FORMS (SOON)</text>
  </g>

  <!-- Bottom-right URL -->
  <text x="1100" y="585" font-family="ui-monospace, SFMono-Regular, monospace" font-size="20" fill="#a3a3a3" text-anchor="end">octovault.ai</text>
</svg>
