  <body>
    <div id="root"></div>

    <!--
      Above-fold copy visible to crawlers without JS execution: HN
      preview, Slack unfurls, archive.org, Lynx, RSS readers, screen
      readers under no-script policies, search engines that don't
      execute heavy SPAs. This block contains the elevator pitch, the
      five product pillars, and an FAQ skeleton — enough that the
      page has real signal even before Vite/React boot.
    -->
    <noscript>
      <main style="max-width:760px;margin:48px auto;padding:0 24px;font-family:system-ui,sans-serif;color:#0a0a0a;line-height:1.6;">
        <header>
          <h1 style="font-size:36px;line-height:1.1;letter-spacing:-0.01em;margin:0 0 16px;">
            Your private AI paperwork vault. Ask anything. Fill anything. Locally.
          </h1>
          <p style="font-size:18px;color:#525252;margin:0 0 24px;">
            NotebookLM uploads to Google. ChatGPT uploads to OpenAI.
            Obsidian doesn't act on your docs. OctoVault keeps your
            paperwork on disk and answers questions or fills forms
            from it.
          </p>
          <p>
            <a href="#waitlist" style="background:#0a0a0a;color:#fafafa;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:600;">
              Join the waitlist
            </a>
          </p>
        </header>

        <section>
          <h2>What it does</h2>
          <ul>
            <li><strong>Extracts facts from documents</strong> — passports, IDs, leases, bills, paystubs, school letters. PDF or photo, text or scanned (on-device OCR via Qwen3-VL or Tesseract).</li>
            <li><strong>Builds a knowledge graph</strong> — every fact is a node, linked to the document that produced it. Source citations are baked in.</li>
            <li><strong>Resolves conflicts</strong> — when two documents disagree on your address or DOB, OctoVault flags it and lets you pin the canonical value.</li>
            <li><strong>Answers questions</strong> — chat with your vault. "When does my passport expire?" Cited answers from your own documents, generated by qwen3:8b running locally via Ollama.</li>
            <li><strong>Multi-entity</strong> — you, your spouse, your kids, your in-laws. The graph handles relationships, derives in-laws and co-parents automatically.</li>
            <li><strong>Coming soon</strong>: a Chrome side panel that auto-fills web forms (visa applications, USCIS forms, school enrolments) from your knowledge graph.</li>
          </ul>
        </section>

        <section>
          <h2>How it's private</h2>
          <ul>
            <li>Documents and extracted facts never leave your device.</li>
            <li>AI runs locally via Ollama (default: qwen3:8b for chat, nomic-embed-text for retrieval embeddings, qwen3-vl:8b for OCR).</li>
            <li>The desktop vault uses SQLCipher with a key derived from your master password.</li>
            <li>The Chrome extension uses WebCrypto + IndexedDB and falls back to a localhost bridge to the desktop app.</li>
            <li>No telemetry on document content. The landing page uses PostHog only for anonymous click events.</li>
          </ul>
        </section>

        <section>
          <h2>FAQ</h2>
          <dl>
            <dt><strong>Does OctoVault upload my documents?</strong></dt>
            <dd>No. Documents and extracted facts never leave your device. The AI runs locally via Ollama; the desktop app talks to it over localhost.</dd>
            <dt><strong>Does it use ChatGPT or Claude?</strong></dt>
            <dd>No. Default models are qwen3:8b and nomic-embed-text, both running on your machine via Ollama. You can swap any other Ollama-compatible model from Settings.</dd>
            <dt><strong>What if I lose my master password?</strong></dt>
            <dd>Your vault is gone — by design. SQLCipher encrypts the database with a key derived from the password; without it, we cannot recover the contents.</dd>
            <dt><strong>Will it work on my old laptop?</strong></dt>
            <dd>Anything from the last 5 years with 8GB RAM. The 8B model is the sweet spot; a smaller model (qwen2.5:3b) runs comfortably on 4GB.</dd>
            <dt><strong>Which browsers does the side panel support?</strong></dt>
            <dd>Any Chromium-based browser at version 114 or newer: Chrome, Edge, Brave, Arc. Firefox doesn't ship the side panel API yet.</dd>
          </dl>
        </section>

        <footer>
          <p style="color:#737373;font-size:13px;margin-top:48px;">
            OctoVault AI is in private beta for macOS. Join the
            waitlist at <a href="https://octovault.ai/">octovault.ai</a>
            for launch updates.
          </p>
        </footer>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx" prerender></script>
