# electron-builder config. Produces unsigned .dmg / .msi / .AppImage from
# the electron-vite output in `out/`. Signing + notarization are off by
# default — wire your Apple/Windows certs separately before publishing.

appId: app.octovault.desktop
productName: OctoVault
copyright: Copyright © 2026 OctoVault

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - package.json
  # Native modules HAVE to be present at runtime — electron-builder pulls in
  # production deps from package.json by default; the previous
  # `!node_modules/**/*` was excluding them.

asar: true
# Native modules can't be loaded from inside an asar archive — the .node
# file has to be on disk. asarUnpack moves matching paths to
# Contents/Resources/app.asar.unpacked/ at package time.
asarUnpack:
  - "node_modules/better-sqlite3-multiple-ciphers/**/*"
  - "node_modules/bindings/**/*"
  - "node_modules/file-uri-to-path/**/*"

# Disable auto-publish; you upload manually.
publish: null

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Signed + notarized release build. Identity is just the cert CN
  # (electron-builder prepends "Developer ID Application: " itself).
  # Notarization requires these env vars at build time:
  #   APPLE_TEAM_ID=6RF9THVXBJ
  #   APPLE_KEYCHAIN_PROFILE=octovault-notarize
  # The keychain profile was set up via `xcrun notarytool store-credentials`
  # and stores the app-specific password securely; nothing sensitive
  # belongs in this YAML.
  identity: "Sunil Deviprasad Tiwari (6RF9THVXBJ)"
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: build/icon.png
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true

dmg:
  title: OctoVault AI
  background: build/background.tiff
  # Window layout for the drag-to-Applications view. The background image
  # has labels positioned to align with these item slots — keep them in
  # sync if you re-design the background.
  window:
    width: 900
    height: 540
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  # icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage
  category: Office
  # icon: build/icon.png
